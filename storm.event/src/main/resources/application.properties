spring.application.name=storm.event
# .env и secrets.properties лежат в корне репозитория, но JVM может стартовать
# из каталога модуля - тогда относительный путь не находится, а optional:
# молча глотает ошибку и подстановка падает на дефолты. Поэтому на каждый файл
# два пути: из корня и из каталога модуля.
# secrets.properties с паролем БД намеренно вне src/main/resources и вне git:
# так креды не уезжают ни в коммиты, ни в собранный jar.
spring.config.import=optional:file:.env[.properties],optional:file:secrets.properties[.properties],optional:file:../.env[.properties],optional:file:../secrets.properties[.properties]

######################## DB ########################
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/storm}
spring.datasource.username=${DB_USER:storm}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Параметры драйвера — свойствами Hikari, а не в URL: DB_URL из окружения
# перекрывает дефолт, и оптимизации молча отключались бы.
# rewriteBatchedStatements - batch insert в один сетевой заход (шаг 226)
# prepared_statement_cache_size - кэш prepared statements на сессии (шаг 225)
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.prepared_statement_cache_size=256
spring.datasource.hikari.data-source-properties.prepared_statement_cache_mode=force

# HikariCP
spring.datasource.hikari.pool-name=storm-pool
# Размер пула считается от ядер хоста, но не больше 10: шаг 319 предписывает
# (cores * 2) + 1, на стенде с 2-4 ядрами это 5-9, 10 - верхняя граница.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=30000
# READ COMMITTED - уровень по умолчанию для PostgreSQL, фиксируем явно (ADR-041):
# SERIALIZABLE даёт дедлоки на конкурентных апсертах без выигрыша в изоляции.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=storm

# Disable Spring SQL init (Flyway only)
spring.sql.init.mode=never

# Transaction timeout
spring.transaction.default-timeout=10s

######################## HTTP ########################
okhttp.connect-timeout-ms=5000
okhttp.read-timeout-ms=10000
okhttp.write-timeout-ms=10000
okhttp.call-timeout-ms=60000
okhttp.retry-on-connection-failure=true
okhttp.max-idle-connections=5
okhttp.keep-alive-minutes=5

######################## TIMEOUT BUDGET (ADR-VL-16) ########################
storm.timeout.softBudgetMs=40000
storm.timeout.hardCeilingMs=60000
storm.timeout.minSourceCallMs=1000

######################## SESSION / IDEMPOTENCY ########################
# Диалог живёт 15 минут с последнего обращения (ADR-VL-02), окно дедупликации - 5 минут
storm.session.ttlMinutes=15
storm.idempotency.ttlMinutes=5

######################## WEB ########################
storm.web.maxOffers=50
storm.web.langs=ru,en

######################## I18N ########################
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

######################## DB EXPERTISE ########################
# Готовность сверяет применённые миграции с ожидаемыми (шаг 369).
# После каждой новой миграции число здесь обязано расти.
# Сколько миграций должно быть применено к моменту готовности. Тест
# MigrationCountTest сверяет это число с количеством файлов V*.sql, поэтому
# после добавления V5 обновить нужно и его, и application.properties.
storm.db.expected-migrations=4

# Срок хранения свой у каждого журнала: у request_log 30 дней, у
# source_error_log 90. Одно общее число вычистило бы историю ошибок
# на два месяца раньше срока (ADR-033).
storm.db.request-log-retention-days=30
storm.db.source-error-log-retention-days=90
storm.db.stats-retention-days=90

# Фоновое обслуживание: партиции вперёд и ретеншн по расписанию
# (ADR-033). Регламент задаётся cron-выражениями с секундами.
storm.db.maintenance-enabled=true
storm.db.maintenance.partition-cron=0 10 3 * * *
storm.db.maintenance.nightly-cron=0 0 4 * * *
storm.db.maintenance.hourly-cron=0 0 * * * *

# Сколько живёт кэш среза состояния миграций для /ready.
storm.db.migrations-cache-ttl-ms=5000

# Размер порции ограниченных DELETE: транзакция не должна держать
# блокировки дольше пользовательского запроса.
storm.db.cleanup-batch=2000

# Месячные партиции журналов: создаются за N месяцев вперёд, удаляются
# не раньше чем месяц целиком вышел за ретеншн и прошло не меньше
# partition-min-keep-months.
storm.db.partition-months-ahead=2
storm.db.partition-min-keep-months=1

# Пороги эксплуатации БД (ADR-039, шаги 331-332). Prometheus в проекте нет
# (ADR-VL-06): нарушения пишутся в лог и видны в /api/v1/diagnostics/db.
storm.db.metrics.enabled=true
storm.db.metrics.slow-query-ms=100
storm.db.metrics.query-budget-ms=200
storm.db.metrics.error-alert-per-minute=5
storm.db.metrics.pool-warn-threads=1
storm.db.metrics.slow-sample-size=50
# Проверка пула в фоне с этим интервалом, мс: без неё алерт переполнения
# срабатывал бы только когда кто-то открыл /api/v1/diagnostics/db.
storm.db.metrics.pool-check-interval-ms=30000

######################## ADMIN ########################
storm.admin.apiKey=${STORM_ADMIN_KEY:}

######################## LLM / OPENROUTER ########################
storm.llm.openrouter.baseUrl=https://openrouter.ai/api/v1
storm.llm.openrouter.apiKey=${OPENROUTER_API_KEY:}
storm.llm.openrouter.model=${OPENROUTER_MODEL:}
storm.llm.openrouter.timeoutMs=30000
storm.llm.contextWindow=20
storm.llm.maxToolRounds=2