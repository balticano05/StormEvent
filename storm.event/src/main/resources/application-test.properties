# Профиль тестов: datasource подставляет Postgres-контейнер (Testcontainers),
# см. com.workspace.storm.event.db.support.PostgresTestSupport. Локальный H2
# не используется: он не поддерживает ON CONFLICT и тип timestamptz,
# то есть не может прогнать реальные запросы репозиториев (ADR-040).
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.pool-name=storm-pool-test

# Фоновое обслуживание выключено: контейнер общий на весь прогон, а партиции
# и ретеншн из фоновой задачи меняют число таблиц и планы у соседних тестов.
# PartitionMaintenance и RetentionService тестируются прямыми вызовами.
storm.db.maintenance-enabled=false

logging.level.org.flywaydb=INFO
