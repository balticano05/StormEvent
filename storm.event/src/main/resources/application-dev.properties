# Профиль разработки: локальная БД из infra/compose.yaml.
#
# Включать явно: -Dspring-boot.run.profiles=dev. В бою профиль не используется,
# поэтому здесь то, что нельзя включать на сервере: DEBUG-лог JDBC (шаг 334),
# который печатает каждый SQL и параметры, и маленький пул - на ноутбуке ядро
# одно, а лишние соединения только мешают.

logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.transaction.interceptor=DEBUG

# Локальный контейнер отдаёт 1-2 соединения: держим пул узким, но не нулевым,
# иначе приложение стартует медленнее первого запроса.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=storm-pool-dev

# Метрики БД видно без серверного доступа: /api/v1/diagnostics/db.
# Ключ dev-заглушка: он защищает только локальный порт 8080.
# Ключ служебного API берётся из окружения, а не зашит сюда: заглушка в
# ресурсах переезжает в собранный jar и в любую сборку, запущенную с этим
# профилем. Пустое значение = служебный API выключен (503).
storm.admin.apiKey=${STORM_ADMIN_KEY:}

# Кэш и логи живут недолго: на dev-базе это удобно видеть целиком,
# а не подгонять объём под продовые сроки ретеншна. Срок у журналов
# разный и на dev тоже: ошибки источников полезно смотреть дольше,
# чем журнал запросов.
storm.db.request-log-retention-days=7
storm.db.source-error-log-retention-days=30
storm.db.stats-retention-days=60
storm.db.partition-months-ahead=1
storm.db.partition-min-keep-months=1